services:
  api:
    build: .
    image: family-gallery-api:latest
    container_name: family-gallery-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY 미설정}
    volumes:
      # NAS 원본. 읽기 전용.
      - /volume2/family-gallery:/data/gallery:ro
      # SQLite 쓰기 영역. 원본 볼륨과 분리.
      - /volume2/docker/family-gallery-api/data:/data/app
    ports:
      # 외부 노출은 Cloudflare Tunnel 단일 경로. 호스트 loopback으로만 바인딩.
      - "127.0.0.1:8080:8080"
